<!DOCTYPE html>
<html lang="uk">
<head><title>Підтвердження</title></head>
<body>
    <h2>Введіть код підтвердження</h2>
    <p>симуляція Email коду.</p>
    
    <form method="post" action="/verify-2fa/">
        {% csrf_token %} <input type="text" name="code" placeholder="4 цифри" required>
        <button type="submit">Підтвердити</button>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
</body>
</html>
